[build-system]
requires = ["setuptools>=84.0.0,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "files_com_mcp"
version = "2.0.23"
description = "Local-only MCP server for the Files.com API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Development builds require files-com 1.0, the unreleased SDK generated
# with them, which no published release satisfies. The release process
# (pre_commit.sh) requires the published SDK releases the server supports.
#
# FastMCP comes as fastmcp-slim with the requirements of its "server" extra
# listed here, as fastmcp-slim 3.4.7 declares them, except for:
#   * py-key-value-aio: the [filetree,memory] stores, not also [keyring]. The
#     server uses the memory and file-tree stores; the keyring store would
#     bring keyring and, on Python 3.11, backports.tarfile.
#   * mcp: exactly 1.30.0, the release whose internals files_com_mcp.patches
#     adapts (and checks at startup), not upstream's mcp>=1.24.0,<2.0.
# scripts/tasks.py check compares this list with fastmcp-slim's metadata, so
# a FastMCP upgrade must reconcile it.
dependencies = [
  "fastmcp-slim==3.4.7",
  "authlib>=1.6.11",
  "cyclopts>=4.0.0",
  "exceptiongroup>=1.2.2",
  "griffelib>=2.0.0",
  "httpx<1.0,>=0.28.1",
  "joserfc>=1.1.0",
  "jsonref>=1.1.0",
  "jsonschema-path>=0.3.4",
  "mcp==1.30.0",
  "openapi-pydantic>=0.5.1",
  "opentelemetry-api>=1.20.0",
  "packaging>=24.0",
  "py-key-value-aio[filetree,memory]<0.5.0,>=0.4.4",
  "pyperclip>=1.9.0",
  "python-multipart>=0.0.26",
  "pyyaml<7.0,>=6.0",
  "starlette>=1.0.1",
  "uncalled-for>=0.2.0",
  "uvicorn>=0.35",
  "watchfiles>=1.0.0",
  "websockets>=15.0.1",
  "files-com>=2.0.0,<3",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Documentation = "https://developers.files.com/python-mcp/"
Source = "https://github.com/Files-com/files-mcp"

[project.scripts]
files-com-mcp = "files_com_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["files_com_mcp", "files_com_mcp.*"]

[tool.black]
line-length = 79
target-version = ["py311"]

[tool.pyright]
include=["files_com_mcp"]
reportMissingTypeArgument=true
reportUnnecessaryCast=true
reportUnnecessaryComparison=true
reportUnnecessaryContains=true
reportUnnecessaryIsInstance=true
# The project currently uses dynamic types
reportGeneralTypeIssues=false
